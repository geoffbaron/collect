openapi: 3.1.0
info:
  title: Collect Public API
  version: "1.0"
  description: |
    The Collect Public API gives property management integrations
    read/write access to your account's properties, buildings, units,
    common areas, rooms, assets, inspections, work orders, capital
    assets, and maintenance schedules.

    ## Authentication
    Every request must include an API key as a bearer token:

    ```
    Authorization: Bearer ck_live_xxxxxxxxxxxxxxxx
    ```

    Create and manage keys from **Dashboard → Settings → Developer**.
    Keys have one of two scopes:

    - `read` — list and get endpoints only
    - `read_write` — full CRUD access

    ## Pagination
    List endpoints accept `limit` (default 50, max 200) and `offset`
    (default 0) query parameters, and return `{ "data": [...], "total": N }`.

    ## Soft deletes
    `DELETE` requests soft-delete a record (sets `deleted_at`). Deleted
    records are excluded from list/get responses.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Your Collect API key, e.g. `Authorization: Bearer ck_live_...`"
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: API key does not have sufficient scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Record not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  parameters:
    limit:
      name: limit
      in: query
      description: Max records to return (default 50, max 200).
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    offset:
      name: offset
      in: query
      description: Number of records to skip (default 0).
      schema: { type: integer, minimum: 0, default: 0 }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Property:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        account_id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        address: { type: string }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    PropertyInput:
      type: object
      required: [name, address]
      properties:
        name: { type: string }
        address: { type: string }
    Building:
      allOf:
        - $ref: "#/components/schemas/BuildingInput"
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            account_id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    BuildingInput:
      type: object
      required: [property_id, name]
      properties:
        property_id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        floor_count: { type: integer, nullable: true }
        year_built: { type: integer, nullable: true }
    Unit:
      allOf:
        - $ref: "#/components/schemas/UnitInput"
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            account_id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    UnitInput:
      type: object
      required: [property_id, unit_number]
      properties:
        property_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid, nullable: true }
        unit_number: { type: string }
        floor_number: { type: integer, nullable: true }
        sqft: { type: number, nullable: true }
        bedrooms: { type: integer, nullable: true }
        bathrooms: { type: number, nullable: true }
        lease_status: { type: string, enum: [vacant, occupied, notice, eviction] }
        turn_status: { type: string, enum: [clean, needs_turn, in_progress, turned] }
        current_tenant_name: { type: string, nullable: true }
        lease_start: { type: string, format: date, nullable: true }
        lease_end: { type: string, format: date, nullable: true }
        monthly_rent: { type: number, nullable: true }
        notes: { type: string }
    CommonArea:
      allOf:
        - $ref: "#/components/schemas/CommonAreaInput"
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            account_id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    CommonAreaInput:
      type: object
      required: [property_id, name]
      properties:
        property_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        area_type: { type: string, enum: [lobby, gym, pool, hallway, laundry, parking, office, other] }
    Room:
      allOf:
        - $ref: "#/components/schemas/RoomInput"
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            account_id: { type: string, format: uuid, readOnly: true }
    RoomInput:
      type: object
      required: [name]
      properties:
        floor_id: { type: string, format: uuid, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        common_area_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
    Asset:
      allOf:
        - $ref: "#/components/schemas/AssetInput"
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            account_id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    AssetInput:
      type: object
      required: [collection_id, name]
      properties:
        collection_id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        asset_description: { type: string }
        condition: { type: string, nullable: true }
        quantity: { type: integer }
        estimated_value: { type: number, nullable: true }
        is_confirmed: { type: boolean }
    Inspection:
      allOf:
        - $ref: "#/components/schemas/InspectionInput"
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            account_id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    InspectionInput:
      type: object
      required: [unit_id, inspection_type]
      properties:
        unit_id: { type: string, format: uuid }
        inspection_type: { type: string, enum: [move_in, move_out, routine, turn] }
        status: { type: string, enum: [in_progress, completed, cancelled] }
        inspector_id: { type: string, format: uuid, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        notes: { type: string }
        baseline_inspection_id: { type: string, format: uuid, nullable: true }
    WorkOrder:
      allOf:
        - $ref: "#/components/schemas/WorkOrderInput"
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            account_id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    WorkOrderInput:
      type: object
      required: [property_id, title]
      properties:
        property_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        common_area_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string }
        category: { type: string, enum: [plumbing, electrical, hvac, appliance, structural, pest, safety, cosmetic, other] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [open, in_progress, completed, cancelled] }
        assigned_to: { type: string, format: uuid, nullable: true }
        reported_by: { type: string, format: uuid, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        source_inspection_id: { type: string, format: uuid, nullable: true }
    CapitalAsset:
      allOf:
        - $ref: "#/components/schemas/CapitalAssetInput"
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            account_id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    CapitalAssetInput:
      type: object
      required: [property_id, name]
      properties:
        property_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        common_area_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        asset_type: { type: string, enum: [hvac, roof, water_heater, appliance, electrical_panel, plumbing, elevator, structural, other] }
        manufacturer: { type: string }
        model: { type: string }
        serial_number: { type: string }
        install_date: { type: string, format: date, nullable: true }
        expected_lifespan_years: { type: integer, nullable: true }
        purchase_cost: { type: number, nullable: true }
        condition: { type: string, enum: [excellent, good, fair, poor, needs_replacement] }
        warranty_expires: { type: string, format: date, nullable: true }
        last_serviced_at: { type: string, format: date, nullable: true }
        notes: { type: string }
    MaintenanceSchedule:
      allOf:
        - $ref: "#/components/schemas/MaintenanceScheduleInput"
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            account_id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    MaintenanceScheduleInput:
      type: object
      required: [property_id, title, frequency, next_due_date]
      properties:
        property_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        common_area_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string }
        category: { type: string, enum: [plumbing, electrical, hvac, appliance, structural, pest, safety, cosmetic, other] }
        frequency: { type: string, enum: [daily, weekly, monthly, quarterly, semiannual, annual] }
        next_due_date: { type: string, format: date }
        last_completed_at: { type: string, format: date-time, nullable: true }
        assigned_to: { type: string, format: uuid, nullable: true }
        active: { type: boolean }
paths:
  /properties:
    get:
      summary: List properties
      tags: [Properties]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Property" } }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a property
      tags: [Properties]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Property" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /properties/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
