            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Property" } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Soft-delete a property
      tags: [Properties]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
